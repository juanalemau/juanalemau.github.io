# Publica el sitio en GitHub Pages en cada push a main.
# Basado en la guía oficial de Quartz (https://quartz.jzhao.xyz/hosting), con las
# actions fijadas por SHA para evitar cambios inesperados en la cadena de suministro.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # usado por resumen-diario.yml

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo para las fechas de los artículos
          persist-credentials: false
      - name: Incluir los resúmenes diarios (rama resumenes)
        run: |
          if git fetch --quiet --depth 1 origin resumenes; then
            git archive FETCH_HEAD content | tar -x
            echo "resúmenes: $(ls content/*/diario/*.md 2>/dev/null | wc -l) archivos"
            python3 scripts/resumen_diario.py --rss content  # RSS e índice del diario por idioma
          else
            echo "todavía no hay rama resumenes"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Caché de npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar plugins de Quartz
        run: npx quartz plugin install
      - name: Generar el sitio
        run: npx quartz build
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
