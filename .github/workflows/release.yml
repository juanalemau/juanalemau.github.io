# Crea/actualiza un PR de release a partir de los Conventional Commits que entran en main.
# Al hacer merge de ese PR se publica la versión (tag + GitHub Release + CHANGELOG).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
