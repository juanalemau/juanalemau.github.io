# Valida nombre de rama, título del PR y cada commit (Conventional Commits 1.0.0:
# https://www.conventionalcommits.org/es/v1.0.0/) y que el sitio compile.
name: Verificaciones del PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  convenciones:
    runs-on: ubuntu-latest
    steps:
      - name: Nombre de la rama
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test|ci|perf|build|style)/[0-9]+-[a-z0-9-]+$ && ! "$BRANCH" =~ ^dependabot/ ]]; then
            echo "::error::La rama '$BRANCH' no sigue el formato <tipo>/<n°-issue>-<descripcion> (ej.: feat/3-articulo-agentes-ia)"
            exit 1
          fi
      - name: Título del PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|revert)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "::error::El título '$TITLE' no sigue Conventional Commits (ej.: feat(contenido): artículo sobre agentes de IA)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mensajes de commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|revert)(\([a-z0-9-]+\))?!?: .+'
          bad=0
          while IFS= read -r msg; do
            [[ "$msg" =~ ^Merge\  ]] && continue
            if [[ ! "$msg" =~ $re ]]; then echo "::error::Commit fuera de Conventional Commits: $msg"; bad=1; fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit $bad

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx quartz plugin install
      - run: npx quartz build
